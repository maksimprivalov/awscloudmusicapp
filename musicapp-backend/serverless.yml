service: cloud-music-backend

provider:
  name: aws
  runtime: python3.9
  region: eu-central-1
  environment:
    USER_POOL_ID: eu-central-1_AHb0aoBcX
    CLIENT_ID: 7gvfvp342fp6i6bdtsjrgl6a47
    TABLE_NAME: Music
    BUCKET_NAME: music-content-storage-605454152564

  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - "dynamodb:PutItem"
        - "dynamodb:GetItem"
        - "dynamodb:Query"
        - "dynamodb:Scan"
        - "dynamodb:UpdateItem"
        - "dynamodb:DeleteItem"
        - "dynamodb:BatchWriteItem"
        - "s3:PutObject"
        - "s3:GetObject"
        - "s3:ListBucket"
      Resource:
        - "arn:aws:dynamodb:eu-central-1:*:table/Artists"
        - "arn:aws:dynamodb:eu-central-1:*:table/Music"
        - "arn:aws:dynamodb:eu-central-1:*:table/Music/index/*"
        - "arn:aws:s3:::${env:BUCKET_NAME}"
        - "arn:aws:s3:::${env:BUCKET_NAME}/*"

        
functions:
  register:
    handler: handler.register
    events:
      - http:
          path: auth/register
          method: post
          cors:
            origin: 'http://localhost:4200'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: true

  login:
    handler: handler.login
    events:
      - http:
          path: auth/login
          method: post
          cors:
            origin: 'http://localhost:4200'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: true

  createArtist:
    handler: handler.create_artist
    events:
      - http:
          path: admin/artist
          method: post
          cors:
            origin: 'http://localhost:4200'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: true
          authorizer:
            type: COGNITO_USER_POOLS
            arn: arn:aws:cognito-idp:eu-central-1:605454152564:userpool/eu-central-1_AHb0aoBcX

  discover:
    handler: handler.discover
    events:
      - http:
          path: discover
          method: get
          cors:
            origin: 'http://localhost:4200'
            headers: [ Content-Type, Authorization ]
            allowCredentials: true

  seed:
    handler: handler.seed
    timeout: 29
    events:
      - http:
          path: admin/seed
          method: post
          cors:
            origin: 'http://localhost:4200'
            headers: [ Content-Type, Authorization ]
            allowCredentials: true

  resetMusic:
    handler: handler.reset_music
    events:
      - http:
          path: admin/reset-music
          method: post
          cors:
            origin: 'http://localhost:4200'
            headers: [ Content-Type, Authorization ]
            allowCredentials: true
          # ako želiš da bude zaštićeno:
          # authorizer:
          #   type: COGNITO_USER_POOLS
          #   arn: arn:aws:cognito-idp:eu-central-1:605454152564:userpool/eu-central-1_AHb0aoBcX


resources:
  Resources:
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId: { Ref: ApiGatewayRestApi }
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'http://localhost:4200'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId: { Ref: ApiGatewayRestApi }
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'http://localhost:4200'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Users
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    ArtistsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Artists
        AttributeDefinitions:
          - AttributeName: artistId
            AttributeType: S
        KeySchema:
          - AttributeName: artistId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    MusicTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Music
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: PK,     AttributeType: S }
          - { AttributeName: SK,     AttributeType: S }
          - { AttributeName: GSI1PK, AttributeType: S }
          - { AttributeName: GSI1SK, AttributeType: S }
          - { AttributeName: GSI2PK, AttributeType: S }
          - { AttributeName: GSI2SK, AttributeType: S }
        KeySchema:
          - { AttributeName: PK, KeyType: HASH }
          - { AttributeName: SK, KeyType: RANGE }
        GlobalSecondaryIndexes:
          - IndexName: GSI1                       # discover po žanru (+ tip)
            KeySchema:
              - { AttributeName: GSI1PK, KeyType: HASH }
              - { AttributeName: GSI1SK, KeyType: RANGE }
            Projection:
              ProjectionType: INCLUDE
              NonKeyAttributes: [ name, entityType, artistId, albumId, primaryGenre ]
          - IndexName: GSI2                       # listanje pesama po albumu/artistu
            KeySchema:
              - { AttributeName: GSI2PK, KeyType: HASH }
              - { AttributeName: GSI2SK, KeyType: RANGE }
            Projection:
              ProjectionType: INCLUDE
              NonKeyAttributes: [ name, trackNo, entityType ]
    
    MusicContentBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${env:BUCKET_NAME}
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins: ['http://localhost:4200']
              AllowedMethods: ['GET','PUT','POST']
              AllowedHeaders: ['*']
              ExposedHeaders: ['ETag']
              MaxAge: 3000

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: false
    slim: true