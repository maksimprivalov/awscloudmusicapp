<div class="app-container">
  <section class="card" style="width:min(1080px, 96vw);">
    <h1>Discover</h1>
    <p class="sub">Filter by genre and type</p>

    <form class="toolbar" [formGroup]="form" (ngSubmit)="search(true)">
      <div class="input">
        <label for="genre">Genre</label>
        <select id="genre" formControlName="genre">
          <option value="">-- choose --</option>
          <option value="pop">Pop</option>
          <option value="rock">Rock</option>
          <option value="lofi">Lo-fi</option>
          <option value="rap">Rap</option>
          <option value="jazz">Jazz</option>
          <option value="electronic">Electronic</option>
          <option value="metal">Metal</option>
          <option value="folk">Folk</option>
        </select>
      </div>

      <div class="input">
        <label for="type">Type</label>
        <select id="type" formControlName="type">
          <option value="">All</option>
          <option value="album">Album</option>
          <option value="artist">Artist</option>
        </select>
      </div>

      <div class="input">
        <label for="limit">Limit</label>
        <input id="limit" type="number" min="1" max="50" formControlName="limit" />
      </div>

      <div style="margin-left:auto;">
        <button class="btn" type="submit" [disabled]="loading">Search</button>
      </div>
    </form>

    <div *ngIf="loading" class="msg info">Loading results…</div>
    <div *ngIf="error" class="msg error">{{ error }}</div>

    <div class="grid" *ngIf="!loading && items?.length">
      <article class="card-sm" *ngFor="let it of items">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
          <strong>{{ it.name }}</strong>
          <span class="badge">{{ it.entityType }}</span>
        </div>
        <div style="color:var(--muted); font-size:13px; margin-top:6px;">
          {{ it.primaryGenre || '—' }}
        </div>
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button class="btn secondary" type="button" (click)="openDetails(it)" [disabled]="it.entityType!=='ALBUM'">Details</button>
          <button class="btn" type="button" disabled>Play</button>
        </div>
      </article>
    </div>

    <div *ngIf="!loading && (!items || !items.length)" class="msg info">
      No results. Try adjusting filters.
    </div>

    <div class="pager" *ngIf="nextKey">
      <button class="btn secondary" type="button" (click)="loadMore()" [disabled]="loading">Load more</button>
    </div>
  </section>
</div>
