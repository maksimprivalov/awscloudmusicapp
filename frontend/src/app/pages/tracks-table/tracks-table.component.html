<div class="app-container">
  <section class="card" style="width:min(1080px,96vw);">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
      <div>
        <h1 style="margin:0;">Songs</h1>
        <p class="sub" style="margin:4px 0 0;">View / edit / delete tracks</p>
      </div>
      <div style="display:flex; gap:8px;">
        <select [(ngModel)]="sortBy" (change)="tracks = sort(tracks, sortBy)"
                style="padding:8px 10px; border:1px solid #e5e7eb; border-radius:10px;">
          <option value="name">Sort: name</option>
          <option value="contentId">Sort: contentId</option>
        </select>
        <button class="btn secondary" (click)="refresh()" [disabled]="loading">
          {{ loading ? 'Loading…' : 'Refresh' }}
        </button>
      </div>
    </div>

    <div *ngIf="loading" class="msg info" style="margin-top:12px;">Loading…</div>
    <div *ngIf="error" class="msg error" style="margin-top:12px;">{{ error }}</div>

    <div *ngIf="!loading && tracks?.length" style="margin-top:16px; overflow:auto; border:1px solid #e5e7eb; border-radius:12px;">
      <table style="width:100%; border-collapse:separate; border-spacing:0;">
        <thead>
        <tr style="background:#f8fafc;">
          <th style="text-align:left; padding:12px 14px; font-size:12px; color:#64748b; border-bottom:1px solid #e5e7eb;">Name</th>
          <th style="text-align:left; padding:12px 14px; font-size:12px; color:#64748b; border-bottom:1px solid #e5e7eb;">Artists</th>
          <th style="text-align:left; padding:12px 14px; font-size:12px; color:#64748b; border-bottom:1px solid #e5e7eb;">Genres</th>
          <th style="text-align:right; padding:12px 14px; font-size:12px; color:#64748b; border-bottom:1px solid #e5e7eb;">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let t of tracks" style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:12px 14px;">{{ t.name || '—' }}</td>
          <td style="padding:12px 14px; color:#334155;">{{ artistDisplay(t) }}</td>
          <td style="padding:12px 14px; color:#64748b;">{{ (t.genres && t.genres.length > 0) ? t.genres.join(', ') : '—' }}</td>
          <td style="padding:12px 14px; text-align:right;">
            <div style="display:inline-flex; gap:8px;">
              <button class="btn"
                      style="border:1px solid #c7d2fe; background:linear-gradient(180deg,#eef2ff,#e0e7ff); color:#3730a3; padding:8px 12px; border-radius:10px; font-weight:600;"
                      (click)="openEdit(t)">
                Edit
              </button>
              <button class="btn"
                      style="border:1px solid #fecaca; background:linear-gradient(180deg,#fee2e2,#fecaca); color:#991b1b; padding:8px 12px; border-radius:10px; font-weight:600;"
                      (click)="onDelete(t)">
                Delete
              </button>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="!loading && (!tracks || !tracks.length)" class="msg info" style="margin-top:16px;">
      No tracks yet.
    </div>
  </section>
</div>

<!-- ===== EDIT MODAL ===== -->
<div *ngIf="editing" style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.45); z-index:50;">
  <div class="card" style="width:min(720px,94vw); max-height:92vh; overflow:auto; padding:18px;">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
      <div>
        <h2 style="margin:0;">Edit track</h2>
        <p class="sub" style="margin:4px 0 0;">contentId:
          <span style="font-family:ui-monospace,Menlo,Consolas,monospace; background:#f1f5f9; border:1px solid #e2e8f0; padding:2px 6px; border-radius:8px;">
            {{ editing.contentId }}
          </span>
        </p>
      </div>
      <button class="btn secondary" (click)="closeEdit()">Close</button>
    </div>

    <div *ngIf="modalError" class="msg error" style="margin-top:12px;">{{ modalError }}</div>

    <form (ngSubmit)="saveEdit()" style="margin-top:16px; display:grid; gap:12px;">
      <div class="input">
        <label>Name</label>
        <input type="text" [(ngModel)]="editName" name="name"
               placeholder="Track name"
               style="padding:10px 12px; border:1px solid #e5e7eb; border-radius:10px;">
      </div>

      <div class="input">
        <label>Artists (comma separated artistIds)</label>
        <input type="text" [(ngModel)]="editArtistsCsv" name="artistsCsv"
               placeholder="artist-uuid-1, artist-uuid-2"
               style="padding:10px 12px; border:1px solid #e5e7eb; border-radius:10px;">
      </div>

      <div class="input">
        <label>Genres (pick 1 or more)</label>
        <select multiple [(ngModel)]="editGenres" name="genres"
                style="padding:8px 10px; border:1px solid #e5e7eb; border-radius:10px; min-height:112px;">
          <option *ngFor="let g of allGenres" [ngValue]="g">{{ g }}</option>
        </select>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <button class="btn secondary" type="button" (click)="closeEdit()">Cancel</button>
        <button class="btn" type="submit" [disabled]="modalLoading"
                style="border:1px solid #c7d2fe; background:linear-gradient(180deg,#eef2ff,#e0e7ff); color:#3730a3; padding:8px 12px; border-radius:10px; font-weight:600;">
          {{ modalLoading ? 'Saving…' : 'Save changes' }}
        </button>
      </div>
    </form>
  </div>
</div>
